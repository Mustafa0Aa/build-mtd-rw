name: Build mtd-rw Final Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Prepare Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget xz-utils zstd libelf-dev libxml-parser-perl

      - name: Clone OpenWrt Snapshot Source
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt

      - name: Configure Target Architecture (ramips / mt7621)
        working-directory: ./openwrt
        run: |
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621_device_generic=y" >> .config
          make defconfig

      - name: Clone mtd-rw and Force Vermagic
        working-directory: ./openwrt
        run: |
          git clone https://github.com/jclehner/mtd-rw.git package/mtd-rw
          
          # فرض بصمة النواة الخاصة براوترك بدقة تامة
          TARGET_VERMAGIC="e10ebac79b8ad3f0e1e6f2d4f19532a8"
          echo "$TARGET_VERMAGIC" > .vermagic
          sed -i "s/STAMP_BUILT:=\$(STAMP_BUILT)_\$(shell \$(SCRIPT_DIR)\/kconfig.pl \$(LINUX_DIR)\/.config | mkhash md5)/STAMP_BUILT:=\$(STAMP_BUILT)_$TARGET_VERMAGIC/g" include/kernel.mk || true

      - name: Compile Package
        working-directory: ./openwrt
        run: |
          make package/mtd-rw/compile V=s

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmod-mtd-rw-mipsel-ipk
          path: openwrt/bin/targets/ramips/mt7621/packages/kmod-mtd-rw*.ipk
