name: Build mtd-rw SDK Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Prepare Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget xz-utils zstd

      - name: Download Snapshot SDK Archive
        run: |
          # رابط أرشيف الـ SDK الخاص بمعمارية mt7621 لإصدارات SNAPSHOT القديمة
          SDK_URL="https://downloads.openwrt.org/snapshots/targets/ramips/mt7621/openwrt-sdk-ramips-mt7621_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
          wget -q -O sdk.tar.xz "$SDK_URL" || wget -q -O sdk.tar.xz "https://downloads.openwrt.org/snapshots/targets/ramips/mt7621/openwrt-sdk-ramips-mt7621_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
          mkdir sdk
          tar -xf sdk.tar.xz -C sdk --strip-components=1

      - name: Clone mtd-rw and Force Vermagic
        working-directory: ./sdk
        run: |
          git clone https://github.com/jclehner/mtd-rw.git package/mtd-rw
          
          # فرض بصمة النواة بالضبط كما ظهرت في الراوتر لديك
          TARGET_VERMAGIC="e10ebac79b8ad3f0e1e6f2d4f19532a8"
          echo "$TARGET_VERMAGIC" > .vermagic
          sed -i "s/STAMP_BUILT:=\$(STAMP_BUILT)_\$(shell \$(SCRIPT_DIR)\/kconfig.pl \$(LINUX_DIR)\/.config | mkhash md5)/STAMP_BUILT:=\$(STAMP_BUILT)_$TARGET_VERMAGIC/g" include/kernel.mk || true
          
          make defconfig

      - name: Compile Package
        working-directory: ./sdk
        run: |
          make package/mtd-rw/compile V=s

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmod-mtd-rw-fixed-ipk
          path: sdk/bin/targets/ramips/mt7621/packages/kmod-mtd-rw*.ipk
