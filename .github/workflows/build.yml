name: Build kmod-mtd-rw for Snapshot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget xz-utils zstd

      - name: Clone OpenWrt Source Code (Snapshot branch)
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          # محاولة اختيار نفس الإصدار التقريبي أو السحب المباشر للفرع الرئيسي
          git checkout master || true

      - name: Update Feeds and Configure
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Force Vermagic and Clone mtd-rw
        working-directory: ./openwrt
        run: |
          git clone https://github.com/jclehner/mtd-rw.git package/mtd-rw
          
          # فرض بصمة النواة (Vermagic) الظاهرة في الصورة لضمان التوافق التام
          TARGET_VERMAGIC="e10ebac79b8ad3f0e1e6f2d4f19532a8"
          echo "$TARGET_VERMAGIC" > .vermagic
          sed -i "s/STAMP_BUILT:=\$(STAMP_BUILT)_\$(shell \$(SCRIPT_DIR)\/kconfig.pl \$(LINUX_DIR)\/.config | mkhash md5)/STAMP_BUILT:=\$(STAMP_BUILT)_$TARGET_VERMAGIC/g" include/kernel.mk || true

      - name: Compile kmod-mtd-rw Package
        working-directory: ./openwrt
        run: |
          make package/mtd-rw/compile V=s

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmod-mtd-rw-snapshot-ipk
          path: openwrt/bin/targets/ramips/mt7621/packages/kmod-mtd-rw*.ipk
